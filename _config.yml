title: Stop Math Mimicking
tagline: Stop copying steps. Start making sense.
description: >-
  Workshops, coaching, and classroom-ready routines that move K–12 math
  teachers and their students from mimicking to sense-making.
url: "https://stopmathmimicking.com"
baseurl: ""
lang: en-US

# ---- Site settings (edit these) ----

founder:
  name: Amanda Radcliff-Smith
  credentials: Ed.D.
  # Path to a headshot, e.g. /assets/images/amanda.jpg. Leave empty to hide.
  photo: ""

# Public contact address for the Contact page. Leave empty to show the
# "contact details coming soon" note instead.
contact_email: ""

links:
  linkedin: https://www.linkedin.com/in/dr-amanda-radcliff-smith-edd-96813851/
  youtube: ""

# Email sign-up for "5 Days to Stop Math Mimicking", powered by AWeber
# (web form 959390808 on list awlist6987623).
# If form_action is empty, the sign-up block shows an "opening soon" message.
signup:
  form_action: https://www.aweber.com/scripts/addlead.pl
  name_field: name          # leave empty to drop the first-name box
  email_field: email
  # Sent with every sign-up, exactly as AWeber's form generator set them.
  # Both redirects point to this site's own confirm-your-email page (/thanks/).
  hidden_fields:
    meta_web_form_id: "959390808"
    meta_split_id: ""
    listname: awlist6987623
    redirect: https://stopmathmimicking.com/thanks/
    meta_redirect_onlist: https://stopmathmimicking.com/thanks/
    meta_adtracking: My_Web_Form
    meta_message: "1"
    meta_required: name,email
    meta_tooltip: ""
  # AWeber's form-view counter (shows "displays" in AWeber's form stats).
  display_pixel: https://forms.aweber.com/form/displays.htm?id=nKyczJwMHAwc
  privacy_url: https://www.aweber.com/permission.htm

# ---- Build settings ----

markdown: kramdown
permalink: /resources/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Amanda Radcliff-Smith

# Both plugins are on GitHub Pages' supported list.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep repo housekeeping files out of the published site.
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
